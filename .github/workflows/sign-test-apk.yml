name: sign test apk
# Manual only. Three jobs: (1) gate: verifier/checker self-tests, no secrets; (2) build: runs the
# repo's tests and Gradle on the exact main commit with NO secrets and uploads the unsigned APK;
# (3) sign: minimal job that holds the key, downloads that exact unsigned APK, checks its SHA-256,
# signs and verifies it. No Gradle, pip or tests run in the signing job.
# This workflow only uploads a signed APK artifact; it does not create a release, tag or commit.
# Publishing that artifact is a separate step; this workflow does not establish human review.
# NOT ACTIVE until the denyut signing key exists, its four secrets (DENYUT_SIGNING_KEYSTORE_BASE64,
# DENYUT_SIGNING_STORE_PASSWORD, DENYUT_SIGNING_KEY_PASSWORD, DENYUT_SIGNING_KEY_ALIAS) are set, and the
# release commit replaces the placeholder EXPECTED_CERT_SHA256 below with the key certificate digest.
on:
  workflow_dispatch:
    inputs:
      confirm_sign:
        description: Type SIGN to build and sign a test APK with the denyut key
        required: true
        type: string
permissions:
  contents: read
env:
  # SET in the release commit: 64 uppercase hex digits of the key certificate. Not a secret.
  EXPECTED_CERT_SHA256: 59A6ADB54F51665F44E5AEA388FFAC15661D4362B7F619CEA6A90BF91ED467F7
  # SET per release in the release commit: must equal the gradle defaults, tools/icon-version.txt and the icon badge.
  EXPECTED_VERSION_NAME: '0.7.3'
  EXPECTED_VERSION_CODE: '9'
  EXPECTED_PACKAGE: com.vanipy.denyut
  EXPECTED_LABEL: denyut
  BUILD_TOOLS_VERSION: 34.0.0
jobs:
  gate:
    if: ${{ inputs.confirm_sign == 'SIGN' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verifier self-test (synthetic bad inputs must fail)
        run: bash tools/test-verify-signed-apk.sh
  build:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      unsigned_sha256: ${{ steps.unsigned.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Version sidecar must equal the release version
        run: |
          set -euo pipefail
          [ "$(< tools/icon-version.txt)" = "$EXPECTED_VERSION_NAME" ] || { echo "tools/icon-version.txt differs from EXPECTED_VERSION_NAME"; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: Gradle 8.9 (checksum verified)
        run: |
          curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/g.zip" | sha256sum -c -
          unzip -q /tmp/g.zip -d /tmp
      - name: Qualify exact commit (local-model gates, full python suite, notice-page host test, local-model Java boundary harness)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "deltachat2[full]==2.58.0" pytest
          python3 tools/check-local-gemma-gates.py
          python3 -m pytest tests -q
          mkdir -p /tmp/notice-page-tests
          javac -d /tmp/notice-page-tests android/app/src/main/java/com/vanipy/denyut/NoticePages.java tests/java/NoticePagesTest.java
          java -ea -cp /tmp/notice-page-tests com.vanipy.denyut.NoticePagesTest
          bash tools/check-java-boundary.sh
          echo "denyut gating tests passed (gates script, full pytest suite, notice-page host test)" > test-summary.txt
      - name: Build unsigned release
        run: (cd android && /tmp/gradle-8.9/bin/gradle --no-daemon "-PversionName=$EXPECTED_VERSION_NAME" "-PversionCode=$EXPECTED_VERSION_CODE" :app:assembleRelease)
      - name: Collect the single unsigned APK
        id: unsigned
        run: |
          set -euo pipefail
          [ "$(ls android/app/build/outputs/apk/release/*.apk | wc -l)" = 1 ]
          cp "$(ls android/app/build/outputs/apk/release/*.apk)" denyut-unsigned.apk
          echo "sha256=$(sha256sum denyut-unsigned.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: denyut-unsigned
          path: |
            denyut-unsigned.apk
            test-summary.txt
          if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: denyut-unsigned
          path: unsigned
      - name: Unsigned APK must be byte-identical to what the build job produced
        env:
          WANT: ${{ needs.build.outputs.unsigned_sha256 }}
        run: |
          set -euo pipefail
          [[ "$WANT" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum unsigned/denyut-unsigned.apk | cut -d' ' -f1)" = "$WANT" ]
      - name: Align and sign
        env:
          KS_B64: ${{ secrets.DENYUT_SIGNING_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.DENYUT_SIGNING_STORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.DENYUT_SIGNING_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.DENYUT_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CERT_SHA256" =~ ^[0-9A-F]{64}$ ]] || { echo "EXPECTED_CERT_SHA256 not filled in; refusing to sign"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          [ -x "$bt/apksigner" ] && [ -x "$bt/zipalign" ]
          work=$(mktemp -d "$RUNNER_TEMP/sign.XXXXXX"); chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KS_B64" | base64 -d > "$work/app.jks"; chmod 600 "$work/app.jks"
          "$bt/zipalign" -f -p 4 unsigned/denyut-unsigned.apk "$work/aligned.apk"
          printf '%s\n%s\n' "$KS_STORE_PW" "$KS_KEY_PW" > "$work/pw"
          "$bt/apksigner" sign --ks "$work/app.jks" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "file:$work/pw" --key-pass "file:$work/pw" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "denyut-v${EXPECTED_VERSION_NAME}.apk" "$work/aligned.apk"
          rm -f "$work/pw" "denyut-v${EXPECTED_VERSION_NAME}.apk.idsig"
      - name: Verify the signed APK (no secrets in this step)
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          [ -x "$bt/aapt2" ]
          out="denyut-v${EXPECTED_VERSION_NAME}.apk"
          "$bt/apksigner" verify --verbose --print-certs "$out" > verify.txt
          "$bt/aapt2" dump badging "$out" > badging.txt
          bash tools/verify-signed-apk.sh verify.txt badging.txt
          grep -q 'native-code:.*arm64-v8a' badging.txt
          sha256sum "$out" | tee "$out.sha256"
          cp unsigned/test-summary.txt test-summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: denyut-signed-test
          path: |
            denyut-v*.apk
            denyut-v*.apk.sha256
            verify.txt
            badging.txt
            test-summary.txt
          if-no-files-found: error
