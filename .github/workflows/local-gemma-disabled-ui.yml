name: Local Gemma disabled-state UI check

on:
  workflow_dispatch:
  push:
    branches: [local-gemma-disabled-ui-20261116]

permissions:
  contents: read

concurrency:
  group: local-gemma-disabled-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  account-free-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert local model activation gates remain closed
        run: python3 tools/check-local-gemma-gates.py

      - name: Run offline Python regression suite
        run: |
          python -m pip install --quiet "deltachat2[full]==2.58.0" pytest
          python -m pytest tests -q

      - name: Run notice-page host test
        run: |
          mkdir -p /tmp/notice-page-tests
          javac -d /tmp/notice-page-tests android/app/src/main/java/com/vanipy/denyut/NoticePages.java tests/java/NoticePagesTest.java
          java -ea -cp /tmp/notice-page-tests com.vanipy.denyut.NoticePagesTest

      - name: Build debug APK (no model weights)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and inspect disabled UI on an account-free emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: adb install -g -r android/app/build/outputs/apk/debug/app-debug.apk && python3 tools/ci-local-ui-smoke.py
