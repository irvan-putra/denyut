name: android-apk
on:
  workflow_dispatch:
    inputs:
      chat_test:
        description: 'Run the relay setup + /echo round trip (creates exactly two throwaway nine.testrun.org accounts; user-approved scope, confirm before each dispatch)'
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No setup-android step: ubuntu-latest ships the Android SDK
      # (android-35 platform + build-tools, licenses pre-accepted).
      # android-actions/setup-android@v3 currently fails on the runner's
      # cmdline-tools 16.0 sdkmanager license prompt.
      - name: Offline witness qualification (no relay, no accounts)
        # Fixture-drives tools/ci-chat-test.py through the real deltachat2
        # parsers against the pinned client/server shapes on every push, so
        # the message-parse contract is enforced before any dispatch can
        # burn a relay account on it.
        run: |
          python3 -m pip install --quiet "deltachat2[full]==2.58.0" pytest
          python3 -m pytest tests/test_ci_witness_offline.py -q
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: denyut-v0.6.4-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: denyut-v0.6.4-debug-apk
          path: apk
      # GitHub-hosted ubuntu-latest runners expose /dev/kvm but the runner
      # user is not always in the kvm group; this udev rule is the standard
      # android-emulator-runner pre-step so the emulator gets hardware
      # acceleration instead of a degraded -accel off boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Push-triggered runs never create relay accounts: the chat
          # round trip (2 throwaway accounts) runs only on an explicit
          # dispatch with chat_test=true, keeping account creation tied
          # to a deliberate, user-scoped action.
          RUN_CHAT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.chat_test }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # The APK is arm64-only (deltachat-rpc-server ships no x86_64
          # Android wheel on PyPI). The x86_64 google_apis API-34 image is
          # VERIFIED to contain libndk_translation, so the arm64 app runs
          # via translation.
          #
          # This action executes each script LINE as its own "sh -c", so
          # loops/conditionals cannot live here - the smoke logic is in
          # tools/ci-smoke.sh. Green requires BOTH the post-JSON-RPC
          # status marker in logcat AND a live rpc-server process.
          # ci-setup-chat.sh then drives the DEBUG-only autosetup hook:
          # a throwaway relay account, securejoin invite, and an /echo
          # round trip from a second throwaway account on the runner.
          script: sh tools/ci-smoke.sh && sh tools/ci-setup-chat.sh
